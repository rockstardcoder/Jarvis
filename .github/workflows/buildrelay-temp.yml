name: BuildRelay Temporary CI
on:
  push:
    branches: [ buildrelay-build-temp ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: buildrelay-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Ensure Android SDK 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" >/dev/null || true
      - name: Apply final source fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/buildrelay/app/GitHubClient.kt')
          s=p.read_text()
          s=s.replace('test -n "$APK" || { echo "No APK generated"; exit 31; }', 'test -n "${\'$\'}APK" || { echo "No APK generated"; exit 31; }')
          s=s.replace('cp "$APK" buildrelay-output/app.apk', 'cp "${\'$\'}APK" buildrelay-output/app.apk')
          s=s.replace("awk '{print $1}'", "awk '{print ${'$'}1}'")
          s=s.replace('"$SIZE" "$SHA" > buildrelay-output/metadata.json', '"${\'$\'}SIZE" "${\'$\'}SHA" > buildrelay-output/metadata.json')
          p.write_text(s)
          Path('gradle.properties').write_text('org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8\norg.gradle.parallel=false\n')
          PY
      - name: Build APK and capture log
        id: compile
        shell: bash
        run: |
          set +e
          gradle :app:assembleDebug --stacktrace --no-daemon > build.log 2>&1
          CODE=$?
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          tail -n 200 build.log
          exit 0
      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BuildRelay-Compiler-Log
          path: buildrelay-ci/build.log
          retention-days: 7
      - name: Fail if compilation failed
        if: steps.compile.outputs.exit_code != '0'
        run: exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: BuildRelay-Final-APK
          path: buildrelay-ci/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
