name: BuildRelay Temporary CI
on:
  push:
    branches: [ buildrelay-build-temp ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: buildrelay-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Ensure Android SDK 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" >/dev/null || true
      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: BuildRelay-Final-APK
          path: buildrelay-ci/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
